# Two runtimes as of the gateway swap. `app` owns the claims domain, the
# database and Gmail. `gateway` owns Telegram, agent sessions and cron. The
# boundary between them is this file as much as it is any code: what the gateway
# cannot see, it cannot leak (ADR-0024).
services:
  app:
    build:
      context: ./app
      args:
        # scripts/deploy.ps1 sets APP_VERSION from the git SHA + branch. Building
        # by hand leaves it "unknown", which the app warns about at startup
        # rather than silently mistagging the message log.
        APP_VERSION: "${APP_VERSION:-unknown}"
    env_file:
      - ./app/.env
    environment:
      # The gateway arrives from its static address on the compose network, not
      # from loopback, so the app's loopback default rejects it with a bare 403.
      # This is the whole reason the subnet is pinned. Found by the first real
      # deploy: the plugin's boot report and the MCP handshake both came back
      # {"error":"rejected"} while the network itself was fine.
      INTERNAL_API_ALLOW_HOSTS: "127.0.0.1,::1,172.28.0.20"
      # Recorded beside app_version on /health, never into it. Two runtimes mean
      # two versions, and telegram_messages.app_version must keep meaning "the
      # Python code that handled this row".
      GATEWAY_VERSION: "${GATEWAY_VERSION:-unknown}"
      # How the app reaches the gateway to SEND. The CLI is baked into this
      # image (see app/Dockerfile) and resolves both of these itself --
      # documented at docs.openclaw.ai/gateway/remote. `ws://`, not `http://`:
      # the gateway protocol is a WebSocket, and the service name resolves on
      # the compose network.
      # The literal address, NOT the `gateway` service name. The CLI refuses
      # plaintext `ws://` to a non-loopback host and cannot tell that a Docker
      # DNS name resolves to a private address -- it fails closed with
      # "SECURITY ERROR: ... uses plaintext ws:// to a non-loopback address".
      # The pinned subnet (below) is what makes hardcoding this safe.
      OPENCLAW_GATEWAY_URL: "ws://172.28.0.20:18789"
      # The same owner-level credential the gateway binds with. This widens the
      # boundary ADR-0024 drew: the app can now drive the gateway, not just be
      # driven by it. Accepted deliberately (Justin, 2026-08-03) as the price of
      # using the product's own client instead of re-deriving its protocol.
      # It is still NOT the Gmail credential, which remains app-only.
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:?the app needs the gateway token to send}"
      # The fast outbound path: the claims plugin's own HTTP route inside the
      # gateway, which dispatches `message.action` in-process. Same host and port
      # as the WebSocket URL above -- the gateway serves both on one listener --
      # and the DNS name is fine here because the ws:// loopback rule that forced
      # the literal IP is a CLI check, not an HTTP one.
      #
      # Blank falls back to the CLI, which still works and still costs ~9s a
      # message. Measured 2026-08-03: ~6.6s of that is the CLI initialising with
      # no network contact at all, so nothing about scheduling can recover it.
      OPENCLAW_GATEWAY_HTTP_URL: "http://172.28.0.20:18789"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      openclaw:
        ipv4_address: 172.28.0.10
    volumes:
      # Bind the real data dir (DB + Gmail token/credentials). Single source of
      # truth shared with the main checkout; the feature worktree ships new code
      # only, never its own copy of the data. ponytail: one data dir, not two.
      - C:/code/Me.OpenClaw/app/data:/data
      # The media outbox: rendered claim cards and review PDFs on their way to
      # Telegram. Narrow on purpose (14.2) — the gateway refuses to send media
      # from a path outside its own allowlist, and those roots are fixed (14.4).
      # This is the ONE path between the two containers, and it must never grow
      # into a general mount of app/data.
      - media_outbox:/data/outbox
      # The gateway CLI's device identity. Shared-secret auth alone is only
      # enough for a LOOPBACK client; this one connects from the compose subnet,
      # so the gateway requires a paired device
      # (docs.openclaw.ai/gateway/security). Pairing is one-time and approved
      # with `openclaw devices approve <id>` on the gateway -- but the token
      # lands here, and without a volume every rebuild would silently need
      # re-pairing and every send would fail until someone noticed.
      - app_openclaw_identity:/root/.openclaw

  gateway:
    image: ghcr.io/openclaw/openclaw:latest
    restart: unless-stopped
    # DELIBERATE ABSENCES, each one load-bearing (7.0a, ADR-0024):
    #   - no env_file. The gateway gets no Gmail credential and no
    #     DATABASE_PATH. gmail-isolation-boundary enforced by the container
    #     boundary rather than by configuration, which is its strongest form.
    #
    #     NARROWED 2026-08-04, and the narrowing is the point: this used to say
    #     "no Google key" and now the gateway holds GEMINI_API_KEY, because Groq
    #     blocks this network (403 to an unauthenticated request; see
    #     scripts/gateway_seed.sh) and Gemini is the only provider left that the
    #     agent can reach. That is a real weakening of the sentence, so it was
    #     checked rather than assumed: a Generative Language API key is a bare
    #     API key, not the OAuth client + refresh token the Gmail path needs, and
    #     `gmail.googleapis.com/users/me/profile`, `.../users/me/messages` and
    #     `drive/v3/files` each returned **401** for it. So the boundary the ADR
    #     actually protects — the gateway cannot read Justin's mail — still holds
    #     mechanically. What is gone is the broader claim that no Google-issued
    #     credential crosses the line.
    #   - no bind mount to app/data. The SQLite file, the OAuth token and the
    #     invoice PDFs are simply not on its filesystem. A read-write open from
    #     the wrong side deleted the WAL sidecars once and took the app down for
    #     51 minutes (2026-07-25); this makes that impossible rather than merely
    #     forbidden.
    #   - no Docker socket.
    environment:
      # ---------------------------------------------------------------------
      # SUPPLYING THIS TOKEN *IS* THE CUTOVER. Leave it empty until then.
      #
      # The gateway auto-enables Telegram the moment it detects a token, and
      # says so without writing config: "auto-enabled plugins for this runtime
      # without writing config: Telegram configured, enabled automatically."
      # The Python app still calls telegram_bot.start_polling(). Two pollers on
      # one token is a 409 Conflict from Telegram and the bot stops working.
      #
      # So this is deliberately NOT required. Slice 1 runs both containers with
      # the gateway holding no token and no channel bound; the app owns Telegram
      # exactly as it does today. Section 4 disables the app's updater and fills
      # this in, in that order, as one step.
      #
      # `scripts/gateway_preflight.py` asserts exactly one poller and fails the
      # deploy if both or neither are live, so getting this wrong is loud.
      #
      # Consequence while it is empty: the plugin cannot claim Telegram's
      # per-chat command menu and logs a warning saying so. Expected, not a
      # fault -- there is no bot for it to claim a menu on.
      # ---------------------------------------------------------------------
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      # It refuses to bind without auth and defaults to 0.0.0.0 in a container.
      # A good default: it fails closed.
      OPENCLAW_GATEWAY_TOKEN: "${OPENCLAW_GATEWAY_TOKEN:?gateway refuses to bind unauthenticated}"
      # How the plugin reaches the app. The service name, NOT
      # host.docker.internal: that resolves through the host and NATs the source
      # address to loopback, which is what made INTERNAL_API_ALLOW_HOSTS useless
      # during the spike (16.2).
      CLAIMS_APP_URL: "http://app:8000"
      CLAIMS_INTERNAL_SECRET: "${INTERNAL_API_SECRET:?the internal surface refuses every request without it}"
      # Read by scripts/gateway_seed.sh, which runs as a one-shot container of
      # this same service and therefore inherits its environment.
      CLAIMS_TELEGRAM_CHAT_ID: "${CLAIMS_TELEGRAM_CHAT_ID:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      # The agent's actual model since 2026-08-04 (Groq is network-blocked).
      # Interpolated from the repo-root .env, never from app/.env -- that file
      # holds the Gmail credential paths and the DB path, and compose cannot read
      # a key out of it without handing over the rest.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    ports:
      # Loopback only. The image declares no EXPOSE, so this has to be explicit.
      - "127.0.0.1:18789:18789"
    networks:
      openclaw:
        ipv4_address: 172.28.0.20
    volumes:
      # Its own state, and only its own: config, sessions, the agent workspace
      # and the Telegram ingress spool. Named rather than bound, so nothing on
      # the host filesystem is reachable by accident.
      - gateway_state:/home/node/.openclaw
      # The read side of the outbox, mounted at <stateDir>/media because the
      # media allowlist is a fixed set of roots and ignores mounts it does not
      # know about. Anywhere else fails with a path error that reads like a
      # permissions problem (14.4). Read-only: the gateway sends these, it does
      # not write them.
      - media_outbox:/home/node/.openclaw/media:ro
      # NOTE: the plugin is COPIED IN by scripts/gateway_configure.ps1, not bind
      # mounted. A Windows bind mount lands as mode 777 and the gateway refuses
      # it -- "blocked plugin candidate: world-writable path" -- which is a
      # sound control: anything that can write a plugin directory can run
      # arbitrary code inside the gateway. Copying keeps the source in the repo
      # and versioned; only the deployed copy lives in the volume.
    depends_on:
      - app

networks:
  openclaw:
    # A fixed subnet so the app can allowlist the gateway by address.
    # INTERNAL_API_ALLOW_HOSTS matches exactly, not by CIDR, and a bridge
    # address is otherwise assigned dynamically. Worth being explicit about how
    # little this buys: the shared secret is the real boundary. The spike showed
    # the allowlist cannot even distinguish the gateway from any other host
    # process when traffic arrives via host.docker.internal (16.2). Over this
    # network it can, which is the reason to use service names rather than the
    # host gateway address.
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  # The app's gateway device identity. Small, and losing it costs a re-pair
  # rather than any data -- but a silent re-pair means every outbound send
  # fails until someone approves the device, so it is a volume rather than a
  # container-lifetime directory.
  app_openclaw_identity:
  # Outside every backup today. 7.0c decides whether it joins db_backup's scope;
  # until then, losing it costs the agent's session history, not claim state.
  gateway_state:
  media_outbox:

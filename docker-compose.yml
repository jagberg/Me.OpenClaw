services:
  app:
    build:
      context: ./app
      args:
        # scripts/deploy.ps1 sets APP_VERSION from the git SHA + branch. Building
        # by hand leaves it "unknown", which the app warns about at startup
        # rather than silently mistagging the message log.
        APP_VERSION: "${APP_VERSION:-unknown}"
    env_file:
      - ./app/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Bind the real data dir (DB + Gmail token/credentials). Single source of
      # truth shared with the main checkout; the feature worktree ships new code
      # only, never its own copy of the data. ponytail: one data dir, not two.
      - C:/code/Me.OpenClaw/app/data:/data
